{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "head.name" . }}-secrets
  namespace: {{ include "head.namespace" . }}
type: Opaque
stringData:
  # Every donated node holds this one, so it authenticates nobody by itself - it
  # only keys the transport. The per-donor enroll token does the authorising.
  FLEET_SECRET: {{ required "secrets.fleetSecret is required" .Values.secrets.fleetSecret | quote }}
  # Deliberately not the fleet secret: that would hand every donor the operator's
  # view of the federation.
  PANEL_SECRET: {{ required "secrets.panelSecret is required" .Values.secrets.panelSecret | quote }}
{{- end }}
