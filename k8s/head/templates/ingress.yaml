{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "head.name" . }}
  namespace: {{ include "head.namespace" . }}
  annotations:
{{ toYaml .Values.ingress.annotations | indent 4 }}
spec:
{{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
{{- end }}
{{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ required "ingress.host is required when the ingress is enabled" .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" .Release.Name) }}
{{- end }}
  rules:
    # Only the subscription and installer are public. The agent and panel ports
    # are not HTTP and have no business behind an HTTP ingress.
    - host: {{ required "ingress.host is required when the ingress is enabled" .Values.ingress.host }}
      http:
        paths:
          - path: /sub/
            pathType: Prefix
            backend:
              service:
                name: {{ include "head.name" . }}
                port:
                  name: sub
          - path: /fed/
            pathType: Prefix
            backend:
              service:
                name: {{ include "head.name" . }}
                port:
                  name: sub
{{- end }}
