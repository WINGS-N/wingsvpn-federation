# Голова сама держит маршрут Traefik: SNI в нём это dest ноды, а он меняется.
# Права ровно на один тип объекта в своём namespace - ни узлов, ни секретов, ни
# чужих неймспейсов.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "head.name" . }}
  namespace: {{ include "head.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "head.name" . }}-ingress
  namespace: {{ include "head.namespace" . }}
rules:
{{- if .Values.ingressRoute.enabled }}
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutetcps"]
    verbs: ["get", "list", "create", "update", "patch"]
{{- end }}
  # Лиза решает, какая реплика активна
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  # Активная голова помечает свой под, чтобы Service выбирал именно её
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "head.name" . }}-ingress
  namespace: {{ include "head.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "head.name" . }}-ingress
subjects:
  - kind: ServiceAccount
    name: {{ include "head.name" . }}
    namespace: {{ include "head.namespace" . }}
