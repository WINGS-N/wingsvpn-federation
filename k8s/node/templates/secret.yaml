{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "node.name" . }}-secrets
  namespace: {{ include "node.namespace" . }}
type: Opaque
stringData:
  # Single use: the node trades it for its own credentials on first start and the
  # head burns it. Leaving it here afterwards is harmless but pointless.
  ENROLL_TOKEN: {{ .Values.head.enrollToken | quote }}
  # Обе половины склеены здесь, а не в args пода: Kubernetes подставляет $(VAR)
  # в командную строку, а её видно в списке процессов на хосте
  ENROLL_COMPOUND: {{ printf "%s.%s" .Values.head.fleetSecret .Values.head.enrollToken | quote }}
  # Keys the transport only; the enroll token does the authorising inside it.
  FLEET_SECRET: {{ .Values.head.fleetSecret | quote }}
  # Loopback only, but still a bearer token: it fronts an API that can create and
  # delete tunnel peers.
  RELAY_GRPC_TOKEN: {{ .Values.relay.grpcToken | quote }}
{{- end }}
